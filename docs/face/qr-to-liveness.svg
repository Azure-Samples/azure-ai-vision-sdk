<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="illustration-title illustration-description">
  <title id="illustration-title">Scan a QR code or tap a session link to start liveness</title>
  <desc id="illustration-description">Start by scanning a website's session QR code or tapping a session link on a phone. Either option opens the mobile app, where device attestation is verified by the backend before the Face liveness session starts. The QR pattern is illustrative and does not contain a real session link.</desc>
  <defs>
    <pattern id="background-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e9eef1" stroke-width="1"/>
    </pattern>
    <symbol id="session-qr" viewBox="0 0 29 29">
      <rect width="29" height="29" fill="#ffffff"/>
      <g fill="#22343b" shape-rendering="crispEdges">
        <path fill-rule="evenodd" d="M2 2h7v7H2z M3 3v5h5V3z M20 2h7v7h-7z M21 3v5h5V3z M2 20h7v7H2z M3 21v5h5v-5z"/>
        <path d="M4 4h3v3H4z M22 4h3v3h-3z M4 22h3v3H4z M11 2h2v2h-2z M15 2h3v1h-3z M12 5h3v2h-3z M16 4h2v4h-2z M10 8h3v2h-3z M14 9h4v2h-4z M2 11h3v2H2z M6 10h2v1H6z M6 13h3v2H6z M3 15h2v3H3z M8 16h3v2H8z M11 12h2v4h-2z M14 13h3v2h-3z M16 16h3v3h-3z M12 18h2v3h-2z M10 22h3v2h-3z M11 26h3v1h-3z M15 22h2v4h-2z M18 21h3v2h-3z M19 25h3v2h-3z M23 24h4v3h-4z M24 20h3v2h-3z M22 17h2v3h-2z M25 14h2v3h-2z M20 11h3v2h-3z M25 10h2v2h-2z M19 14h3v2h-3z"/>
      </g>
    </symbol>
    <clipPath id="portrait-viewport">
      <rect x="709" y="137" width="168" height="230" rx="12"/>
    </clipPath>
  </defs>

  <rect width="960" height="530" fill="#ffffff"/>
  <rect x="16" y="24" width="928" height="420" fill="url(#background-grid)"/>

  <g font-family="Segoe UI, sans-serif" letter-spacing="0">
    <g stroke="#33474e" stroke-width="3" stroke-linejoin="round">
      <path d="M169 355v28h66v-28" fill="#edf2f4"/>
      <path d="M131 385h142" fill="none" stroke-linecap="round"/>
      <rect x="32" y="72" width="340" height="288" rx="10" fill="#ffffff"/>
      <path d="M33 112h338" fill="none" stroke="#dce5e9" stroke-width="2"/>
    </g>
    <g fill="#a7b8c0">
      <circle cx="53" cy="93" r="4"/>
      <circle cx="68" cy="93" r="4"/>
      <circle cx="83" cy="93" r="4"/>
    </g>
    <rect x="110" y="85" width="242" height="16" rx="4" fill="#eef3f5"/>
    <use href="#session-qr" x="108" y="137" width="174" height="174"/>
    <path d="M120 131h-18v18m168-18h18v18m-186 150v18h18m168-18v18h-18" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="195" y="337" text-anchor="middle" fill="#526b75" font-size="17">Session QR</text>

    <g transform="rotate(8 350 313)">
      <rect x="278" y="193" width="157" height="252" rx="26" fill="#22343b" opacity="0.12"/>
      <rect x="272" y="186" width="157" height="252" rx="26" fill="#26383f"/>
      <rect x="280" y="195" width="141" height="233" rx="20" fill="#f4f9fc"/>
      <rect x="318" y="195" width="65" height="14" rx="7" fill="#26383f"/>
      <text x="350" y="237" text-anchor="middle" fill="#33474e" font-size="16" font-weight="600">Session link</text>
      <rect x="300" y="256" width="101" height="5" rx="2.5" fill="#d2e4ee"/>
      <rect x="300" y="269" width="72" height="5" rx="2.5" fill="#d2e4ee"/>
      <text x="350" y="299" text-anchor="middle" fill="#0078d4" font-size="16" font-weight="600">Start liveness</text>
      <path d="M301 304h99" fill="none" stroke="#0078d4" stroke-width="1.5"/>
      <circle cx="361" cy="311" r="16" fill="#0078d4" opacity="0.08"/>
      <path d="M338 313h-7m30-25v-7m18 13 5-5" fill="none" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/>
      <path d="M356 344v-28a5 5 0 0 1 10 0v19c0-5 9-5 9 0v4c0-5 9-5 9 0v4c0-5 9-5 9 0v15c0 15-7 23-11 31h-24c-5-9-12-17-20-27-3-4 3-9 7-5l11 9" fill="#deb094" stroke="#33474e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M366 335v13m9-9v11m9-7v9" fill="none" stroke="#b17b5f" stroke-width="2" stroke-linecap="round"/>
      <path d="M330 419h41" fill="none" stroke="#a7b8c0" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="#0078d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M455 247h181m-13-13 13 13-13 13"/>
      <path d="M536 205v-8a9 9 0 0 1 18 0v8"/>
      <rect x="531" y="205" width="28" height="23" rx="4" fill="#ffffff"/>
      <path d="M545 214v5"/>
    </g>
    <g text-anchor="middle" fill="#526b75" font-size="22">
      <text x="545" y="287">Device</text>
      <text x="545" y="313">attestation</text>
    </g>

    <rect x="689" y="68" width="220" height="371" rx="30" fill="#22343b" opacity="0.12"/>
    <rect x="683" y="61" width="220" height="371" rx="30" fill="#26383f"/>
    <rect x="692" y="71" width="202" height="351" rx="22" fill="#ffffff"/>
    <rect x="751" y="71" width="84" height="16" rx="8" fill="#26383f"/>
    <circle cx="853" cy="83" r="3" fill="#7ea298"/>
    <text x="793" y="118" text-anchor="middle" fill="#26383f" font-size="19" font-weight="600">Liveness</text>

    <g clip-path="url(#portrait-viewport)">
      <rect x="709" y="137" width="168" height="230" fill="#eaf6f2"/>
      <path d="M718 375c0-39 27-70 65-70h20c38 0 65 31 65 70" fill="#168c88"/>
      <path d="M775 272h36v37c-8 13-28 13-36 0z" fill="#c58e70"/>
      <path d="M752 232v-24c0-28 16-47 42-47s42 19 42 47v24l-11 13h-61z" fill="#293c41"/>
      <ellipse cx="760" cy="239" rx="7" ry="10" fill="#d9a586"/>
      <ellipse cx="829" cy="239" rx="7" ry="10" fill="#d9a586"/>
      <path d="M761 210c17 0 31-7 42-19 7 13 17 19 26 21v33c0 25-15 43-34 43s-34-18-34-43z" fill="#deb094"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M775 235h4m32 0h4" stroke="#293c41" stroke-width="3"/>
        <path d="M795 242l-3 11h6" stroke="#b17b5f" stroke-width="2"/>
        <path d="M784 263c6 5 16 5 22 0" stroke="#8c5943" stroke-width="2.5"/>
        <path d="M769 225c4-2 9-2 13 0m26 0c4-2 9-2 13 0" stroke="#755642" stroke-width="2"/>
      </g>
      <ellipse cx="793" cy="239" rx="72" ry="91" fill="none" stroke="#168c88" stroke-width="2.5" stroke-dasharray="9 7"/>
    </g>
    <path d="M722 148h-7v18m149-18h7v18m-156 172v18h7m149-18v18h-7" fill="none" stroke="#168c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="719" y="386" width="148" height="6" rx="3" fill="#e1ece8"/>
    <rect x="719" y="386" width="90" height="6" rx="3" fill="#168c88"/>
    <path d="M767 413h52" fill="none" stroke="#a7b8c0" stroke-width="3" stroke-linecap="round"/>

    <circle cx="93" cy="484" r="20" fill="#e5f2fc"/>
    <text x="93" y="491" text-anchor="middle" fill="#0068b8" font-size="21" font-weight="600">1</text>
    <text x="127" y="494" fill="#26383f" font-size="30" font-weight="600">Scan QR or tap link</text>
    <circle cx="669" cy="484" r="20" fill="#e2f3ed"/>
    <text x="669" y="491" text-anchor="middle" fill="#087c70" font-size="21" font-weight="600">2</text>
    <text x="703" y="494" fill="#26383f" font-size="30" font-weight="600">Start liveness</text>
  </g>
</svg>
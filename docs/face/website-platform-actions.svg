    <text x="536" y="261" font-size="23">Session</text>
    <rect x="472" y="290" width="128" height="74" rx="6" fill="#087c70"/>
    <g fill="#ffffff" font-size="24" font-weight="600">
      <text x="536" y="320">Open</text>
      <text x="536" y="349">App Clip</text>
    </g>
    <path d="M517 401h38" fill="none" stroke="#a7b8c0" stroke-width="3" stroke-linecap="round"/>

    <g font-size="22" fill="#526b75">
      <text x="130" y="455">QR contains</text>
      <text x="130" y="483">HTTPS session URL</text>
      <text x="344" y="455">Intent link</text>
      <text x="536" y="455">App Clip link</text>

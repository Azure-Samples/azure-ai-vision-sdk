    <rect x="267" y="209" width="154" height="204" rx="17" fill="#ffffff"/>
    <rect x="315" y="209" width="58" height="11" rx="5" fill="#26383f"/>
    <text x="344" y="261" font-size="23">Session</text>
    <rect x="280" y="290" width="128" height="74" rx="6" fill="#0078d4"/>
    <g fill="#ffffff" font-size="24" font-weight="600">
      <text x="344" y="320">Open</text>
      <text x="344" y="349">in app</text>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Liveness Detector</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #container { width: 100%; height: 100%; }
        .status { text-align: center; padding: 2rem; color: #555; font-family: 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="container">
        <div class="status">Please wait, still loading.</div>
    </div>
    <script type="module">
        // This page runs the Face Liveness SDK in an isolated global scope,
        // avoiding the Emscripten collision with Blazor's .NET WASM runtime.
        // Communication with the parent Blazor app is via postMessage.

        let sdkImported = false;

        async function importSdk() {
            if (sdkImported) return;
            try {
                await import("/FaceLivenessDetector.js");
                sdkImported = true;
                console.log("[FaceDetectorFrame] SDK imported, custom element registered:",
                    !!customElements.get("azure-ai-vision-face-ui"));
            } catch (error) {
                console.error("[FaceDetectorFrame] Failed to import SDK:", error);
                parent.postMessage({ type: "liveness-error", error: { livenessError: "Failed to load SDK: " + error.message } }, "*");
            }
        }

        async function startDetection(authToken) {
            await importSdk();
            if (!sdkImported) return;

            const container = document.getElementById("container");
            container.innerHTML = "";

            const detector = document.createElement("azure-ai-vision-face-ui");
            container.appendChild(detector);

            try {
                console.log("[FaceDetectorFrame] Calling .start()...");
                const resultData = await detector.start(authToken);
                console.log("[FaceDetectorFrame] .start() resolved:", resultData);
                parent.postMessage({ type: "liveness-success", result: JSON.stringify(resultData) }, "*");
            } catch (error) {
                console.error("[FaceDetectorFrame] .start() rejected:", error);
                parent.postMessage({
                    type: "liveness-error",
                    error: {
                        livenessError: error.livenessError || error.message || "Unknown error",
                        recognitionError: error.recognitionError || ""
                    }
                }, "*");
            }
        }

        // Listen for commands from the parent Blazor app
        window.addEventListener("message", (event) => {
            if (event.data?.type === "start-liveness") {
                startDetection(event.data.authToken);
            }
        });

        // Signal to parent that the frame is ready
        parent.postMessage({ type: "liveness-ready" }, "*");
    </script>
</body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-ai-vision-face-deviceattestation"
version = "0.0.2"
description = "Azure AI Vision Face device-attestation backend library. Server-side verification for the liveness attestation flow — the backend counterpart to the iOS and Android device-attestation client SDKs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
keywords = ["azure", "face", "liveness", "attestation", "app-attest", "play-integrity"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "asn1crypto>=1.5.1",
  "cryptography>=45.0",
  "cbor2>=5.6",
  "tink>=1.10",
  "google-auth>=2.28",
  "google-api-python-client>=2.120",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Azure-Samples/azure-ai-vision-sdk"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["azure_ai_vision_face_deviceattestation*"]

[tool.setuptools.package-data]
azure_ai_vision_face_deviceattestation = ["py.typed"]
